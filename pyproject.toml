[project]
name = "careeros-identity-service"
version = "0.1.0"
description = "CareerOS identity and authorization boundary"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.165,<0.166",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.16,<3",
  "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = [
  "bandit>=1.9,<2",
  "httpx2>=2.16,<3",
  "mypy>=1.19,<2",
  "pip-audit>=2.10,<3",
  "pytest>=9.2,<10",
  "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_identity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.careeros.quality]
package = "src/careeros_identity"
persistence = false
domain = "src/careeros_identity/domain"
application = "src/careeros_identity/application"
ports = "src/careeros_identity/application"
adapters = "src/careeros_identity/adapters"
composition_root = "src/careeros_identity/adapters/http.py"

[tool.careeros.quality.commands]
format = "uv run ruff format --check ."
lint = "uv run ruff check ."
type = "uv run mypy src tests"
test = "uv run pytest"
secret = "gitleaks detect --redact --no-banner"
security = "uv run pip-audit && uv run bandit -q -r src"

[tool.careeros.quality.logging]
structured = true
correlation = true
redaction = true

[tool.careeros.quality.evidence]
unit = "tests/test_app.py"
integration = "tests/test_app.py"
contract = "tests/test_app.py"
health = "tests/test_app.py"
logging = "tests/test_app.py"
security = "tests/test_app.py"
